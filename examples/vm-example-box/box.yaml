# Virtual machine example manifest
# Docs: https://docs.destrier.io/contributing/box-structure#manifest-examples

# Identity
id: signal-desk
competitionId: reference-examples
version: 1.0.4
name: "Signal Desk"
authors: [destrier-team]
# Classification
runType: vm
category: [web, file-disclosure]
difficulty: easy
# Objectives
objective: "Exploit path traversal in the file portal and read the flag as the analyst user"
flags:
  - host: host
    gating: user
    value: "destrier{51gn4l_d35k_p47h_7r4v3r54l}"
# Networking
entrypoint:
  network: main
networks:
  - name: main
    cidr: 10.10.2.0/24
# Hosts
hosts:
  - name: host
    kind: vm
    os: linux
    build:
      # ⚠️ `image`, not `source`. The compiler refuses a VM host that builds from
      # source -- nothing builds and publishes host images yet -- so an author
      # runs Packer themselves and points this at what it produced. `boxr box
      # push` uploads the file and rewrites this key into its content digest.
      image:
        # written by `boxr box push` — do not edit by hand
        artifact: sha256:2fe400c0bba86413c77e7783d833d32190f0560dc964bf1898ed125e711a0c45
        format: qcow2
        sizeBytes: 2305949696
        path: target/host/output-signal-desk/signal-desk.qcow2
    networks:
      - name: main
        ip: 10.10.2.10
    # Readiness, declared. A native hop is probed for this directly by the
    # controller over the run network; a QEMU hop answers it from inside the
    # cell. Declaring it no longer decides the substrate.
    healthcheck: "http:80/health"
