# Virtual machine example manifest
# Docs: https://docs.destrier.io/contributing/box-structure#manifest-examples

# Identity
id: signal-desk
version: 1.0.7
name: "Signal Desk"
authors: [destrier-team]
# Classification
runType: vm
category: [web, file-disclosure]
difficulty: easy
# Objectives
objective: "Exploit path traversal in the file portal and read the flag as the analyst user"
flags:
  - host: host
    gating: user
    value: "destrier{51gn4l_d35k_p47h_7r4v3r54l}"
# Networking
entrypoint:
  network: main
networks:
  - name: main
    cidr: 10.10.2.0/24
# Hosts
hosts:
  - name: host
    kind: vm
    os: linux
    build:
      # Uploaded image metadata is generated during submission. New boxes should
      # start with a local disk path and let the submission workflow rewrite it.
      image:
        # written by `boxr box push` — do not edit by hand
        artifact: sha256:3fc8ee58068dc6a56ee248551ef309e553e4cf21b3f903500646e72d6d4cae2d
        format: qcow2
        sizeBytes: 2354053120
        path: target/host/output-signal-desk/signal-desk.qcow2
    networks:
      - name: main
        ip: 10.10.2.10
    healthcheck: "http:80/health"
