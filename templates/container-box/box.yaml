# Container box manifest
# Docs: https://docs.destrier.io/contributing/box-structure#manifest-examples

# Identity
id: your-box-id                       # Permanent box slug, lowercase, hyphens only
# No competition key: a box reaches a competition when you grant it to the
# organiser after it is published. See the docs link above.
version: 1.0.0
name: "Your box name"
authors: [your-handle]

# Classification
runType: container
category: [web]                       # One or more hyphenated skill areas
difficulty: easy                      # easy | medium | hard | insane

# Objectives
objective: "Describe what a successful solve is."
# Each value is planted verbatim in the target; destrier{...} with 1337 text inside.
flags:
  - host: app                         # Must match a host below
    gating: service-user              # user | root | service-user | administrator | system | domain-admin
    value: "destrier{pr3v13w_53rv1c3_0wn3d}"

# Networking (each network is a /24 inside 10.10.0.0/16)
entrypoint:
  network: main                       # Must match a network below
networks:
  - name: main
    cidr: 10.10.0.0/24

# Hosts
hosts:
  - name: app
    kind: container
    build:
      source: target/app              # Dir with your Dockerfile + app source
    networks:
      - name: main
        ip: 10.10.0.10                # Static IP, inside the network's /24
    healthcheck: "http:8000/health"   # Optional — tcp:PORT | http:PORT/path | https:PORT/path
