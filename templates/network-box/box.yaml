# Network box manifest
# Docs: https://docs.destrier.io/contributing/box-structure#manifest-examples

# Identity
id: your-box-id                       # Unique within the competition, lowercase, hyphens only
competitionId: your-competition-id    # Competition slug, lowercase, hyphens only
version: 1.0.0
name: "Your box name"
authors: [your-handle]

# Classification
runType: network
category: [lateral-movement]          # One or more hyphenated skill areas
difficulty: hard                      # easy | medium | hard | insane

# Objectives
objective: "Describe the final objective."
# Each value is planted verbatim in the target; destrier{...} with 1337 text inside.
flags:
  - host: dmz                         # Must match a host below
    gating: root                      # user | root | service-user | administrator | system | domain-admin
    value: "destrier{dmz_p1v07_c0mpl373}"
  - host: internal                    # Must match a host below
    gating: user                      # user | root | service-user | administrator | system | domain-admin
    value: "destrier{1n73rn4l_p1v07_pr00f}"

# Networking (each network is a /24 inside 10.10.0.0/16)
entrypoint:
  network: external                   # Must match a network below
networks:
  - name: external
    cidr: 10.10.0.0/24
  - name: corp
    cidr: 10.10.1.0/24

# Hosts
hosts:
  - name: dmz
    kind: container
    build:
      source: target/dmz              # Dir with your Dockerfile + app source
    networks:
      - name: external
        ip: 10.10.0.10                # Static IP, inside the network's /24
      - name: corp
        ip: 10.10.1.10                # Static IP, inside the network's /24
    healthcheck: "tcp:80"             # Optional — tcp:PORT | http:PORT/path | https:PORT/path
  - name: internal
    kind: container
    build:
      source: target/internal         # Dir with your Dockerfile + app source
    networks:
      - name: corp
        ip: 10.10.1.20                # Static IP, inside the network's /24
    healthcheck: "tcp:80"             # Optional — tcp:PORT | http:PORT/path | https:PORT/path
